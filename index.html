<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件夹镜像同步</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a212b;
    --panel-2: #222b38;
    --border: #2c3744;
    --text: #e6edf3;
    --text-dim: #8b98a5;
    --accent: #4f9dff;
    --accent-2: #2b6fd6;
    --green: #3fb950;
    --red: #f85149;
    --amber: #d29922;
    --radius: 12px;
    --shadow: 0 8px 30px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 80% -10%, #16202c 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 32px 20px 64px; }
  header h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: .5px; }
  header p { color: var(--text-dim); margin: 0 0 24px; font-size: 14px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .folder-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .folder {
    flex: 1 1 280px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    transition: border-color .15s, transform .05s;
  }
  .folder:active { transform: scale(.995); }
  .folder .label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .folder .name { font-size: 15px; margin: 8px 0 4px; word-break: break-all; min-height: 22px; }
  .folder .name.empty { color: #5b6675; font-weight: 400; }
  .folder .meta { font-size: 12px; color: var(--text-dim); }
  .folder.src { border-left: 3px solid var(--accent); }
  .folder.dst { border-left: 3px solid var(--amber); }

  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 14px;
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s, border-color .15s, opacity .15s;
  }
  .btn:hover { background: #2a3543; border-color: #3a4756; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--accent-2); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent); }
  .btn.danger { background: #3a1f1f; border-color: var(--red); color: #ffb4ae; }
  .btn.danger:hover { background: #4d2626; }
  .btn.small { padding: 7px 12px; font-size: 13px; }

  .actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 4px; }

  .notice {
    border-radius: 10px; padding: 12px 14px; font-size: 13px; margin-bottom: 16px;
    border: 1px solid var(--border); background: var(--panel-2);
  }
  .notice.warn { border-color: #5a4318; background: #2a2113; color: #f0d29a; }
  .notice.error { border-color: #5a2222; background: #2a1515; color: #ffb4ae; }
  .notice.ok { border-color: #1f4a2a; background: #15261a; color: #a7e8b6; }

  .preview { display: none; }
  .preview.show { display: block; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat {
    flex: 1 1 120px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
  }
  .stat .n { font-size: 22px; font-weight: 600; }
  .stat .t { font-size: 12px; color: var(--text-dim); }
  .stat.del .n { color: var(--red); }
  .stat.add .n { color: var(--green); }
  .stat.same .n { color: var(--text-dim); }

  .lists { display: flex; gap: 14px; flex-wrap: wrap; }
  .listbox { flex: 1 1 280px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .listbox h4 { margin: 0; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
  .listbox.del h4 { color: #ffb4ae; }
  .listbox.add h4 { color: #a7e8b6; }
  .listbox .items { max-height: 240px; overflow-y: auto; padding: 6px 0; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .listbox .items div { padding: 3px 14px; word-break: break-all; color: var(--text-dim); }
  .listbox.del .items div { color: #e8a9a3; }
  .listbox.add .items div { color: #9fe3ad; }
  .more { padding: 6px 14px; color: var(--text-dim); font-size: 12px; font-style: italic; }

  .progress-wrap { display: none; margin-top: 14px; }
  .progress-wrap.show { display: block; }
  .bar { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
  .bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transition: width .15s; }
  .progress-text { font-size: 12px; color: var(--text-dim); margin-top: 6px; }

  .log { margin-top: 14px; background: #0c1117; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; max-height: 220px; overflow-y: auto; display: none; }
  .log.show { display: block; }
  .log .line { padding: 2px 0; color: var(--text-dim); }
  .log .line.ok { color: #9fe3ad; }
  .log .line.err { color: #ffb4ae; }

  .checkbox { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); margin-top: 14px; }
  .checkbox input { width: 16px; height: 16px; accent-color: var(--accent); }

  footer { color: #5b6675; font-size: 12px; margin-top: 8px; text-align: center; }

  .reward { text-align: center; }
  .reward .rtitle { font-size: 18px; font-weight: 600; }
  .reward .rsub { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
  .tabs { display: flex; gap: 10px; justify-content: center; margin: 16px 0 12px; }
  .tab { appearance: none; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-size: 14px; padding: 9px 22px; border-radius: 8px; cursor: pointer; transition: background .15s, border-color .15s; }
  .tab:hover { background: #2a3543; }
  .tab.active { background: var(--accent-2); border-color: var(--accent); color: #fff; }
  .qr-wrap { display: flex; justify-content: center; }
  .qr-wrap img { width: 220px; height: 220px; object-fit: contain; background: #fff; border-radius: 12px; padding: 10px; border: 1px solid var(--border); }
  .qr-tip { color: var(--text-dim); font-size: 13px; margin-top: 12px; }
  code { background: var(--panel-2); padding: 1px 6px; border-radius: 5px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📁 文件夹镜像同步</h1>
    <p>选择源文件夹与目标文件夹，点击同步后，目标文件夹将被修改为与源文件夹<strong>完全一致</strong>（目标中多余的文件/文件夹会被删除，源中已有的文件会被覆盖更新）。</p>
  </header>

  <div id="supportNotice"></div>

  <div class="card">
    <div class="folder-row">
      <div class="folder src">
        <div class="label">源文件夹（Source）</div>
        <div class="name empty" id="srcName">未选择</div>
        <div class="meta" id="srcMeta">点击右侧按钮选择</div>
      </div>
      <div class="folder dst">
        <div class="label">目标文件夹（Target）</div>
        <div class="name empty" id="dstName">未选择</div>
        <div class="meta" id="dstMeta">点击右侧按钮选择</div>
      </div>
    </div>
    <div class="actions" style="margin-top:16px;">
      <button class="btn" id="pickSrc">选择源文件夹</button>
      <button class="btn" id="pickDst">选择目标文件夹</button>
      <button class="btn" id="scanBtn" disabled>扫描差异</button>
    </div>
  </div>

  <div class="card preview" id="previewCard">
    <div class="stats">
      <div class="stat del"><div class="n" id="statDel">0</div><div class="t">将在目标中删除</div></div>
      <div class="stat add"><div class="n" id="statAdd">0</div><div class="t">将新增 / 更新</div></div>
      <div class="stat same"><div class="n" id="statSame">0</div><div class="t">目标已存在（将覆盖）</div></div>
    </div>
    <div class="lists">
      <div class="listbox del">
        <h4><span>待删除</span><span id="delCount">0</span></h4>
        <div class="items" id="delList"></div>
      </div>
      <div class="listbox add">
        <h4><span>待新增 / 更新</span><span id="addCount">0</span></h4>
        <div class="items" id="addList"></div>
      </div>
    </div>
    <label class="checkbox">
      <input type="checkbox" id="confirmBox">
      我已了解：同步后目标文件夹将与源文件夹完全相同，目标中多余的文件将被<strong>永久删除</strong>。
    </label>
    <div class="actions" style="margin-top:16px;">
      <button class="btn danger" id="syncBtn" disabled>立即同步</button>
      <button class="btn" id="stopBtn" style="display:none;">停止同步</button>
    </div>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="bar"><i id="barFill"></i></div>
    <div class="progress-text" id="progressText">准备中…</div>
  </div>

  <div class="log" id="logBox"></div>

  <div class="card reward">
    <div class="rtitle">☕ 打赏支持</div>
    <div class="rsub">如果这个工具帮到了你，可以请我喝杯咖啡</div>
    <div class="tabs">
      <button class="tab active" data-pay="alipay">支付宝</button>
      <button class="tab" data-pay="wechat">微信支付</button>
    </div>
    <div class="qr-wrap">
      <img id="qrImg" src="qr/alipay.jpg" alt="打赏二维码">
    </div>
    <div class="qr-tip" id="qrTip">支付宝扫一扫，感谢支持！</div>
  </div>

  <footer>
    纯本地运行，文件不会上传到任何服务器 · 建议使用 Chrome / Edge 浏览器 · 首次使用需在弹窗中授权文件夹访问
  </footer>
</div>

<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);

  // 浏览器支持检测
  const supported = typeof window.showDirectoryPicker === "function";
  if (!supported) {
    const n = $("supportNotice");
    n.className = "notice error";
    n.innerHTML = "⚠️ 当前浏览器不支持文件夹访问 API（File System Access API）。请使用 <strong>Chrome</strong> 或 <strong>Edge</strong> 浏览器打开本页面（且需通过 <code>https</code> 或 <code>localhost</code> 访问，不能直接双击用 <code>file://</code> 打开）。";
    ["pickSrc","pickDst","scanBtn"].forEach(id => $(id).disabled = true);
    return;
  }

  let srcHandle = null, dstHandle = null;

  // 递归遍历目录，产出所有文件相对路径 + 句柄
  async function* walkFiles(dir, prefix) {
    for await (const [name, handle] of dir.entries()) {
      const rel = prefix ? prefix + "/" + name : name;
      if (handle.kind === "file") {
        yield { rel, handle };
      } else if (handle.kind === "directory") {
        yield* walkFiles(handle, rel);
      }
    }
  }

  // 递归列出所有条目（文件 + 目录），记录父句柄以便删除
  async function listAll(dir, prefix, acc) {
    for await (const [name, handle] of dir.entries()) {
      const rel = prefix ? prefix + "/" + name : name;
      acc.push({ rel, name, kind: handle.kind, parent: dir, handle });
      if (handle.kind === "directory") {
        await listAll(handle, rel, acc);
      }
    }
    return acc;
  }

  // 在 root 下逐级获取/创建目录
  async function getOrCreateDir(root, relDir) {
    if (!relDir) return root;
    let dir = root;
    for (const p of relDir.split("/")) {
      dir = await dir.getDirectoryHandle(p, { create: true });
    }
    return dir;
  }

  function dirname(rel) {
    const i = rel.lastIndexOf("/");
    return i === -1 ? "" : rel.substring(0, i);
  }
  function basename(rel) {
    const i = rel.lastIndexOf("/");
    return i === -1 ? rel : rel.substring(i + 1);
  }

  async function pick(isSrc) {
    try {
      const handle = await window.showDirectoryPicker();
      if (isSrc) {
        srcHandle = handle;
        $("srcName").textContent = handle.name;
        $("srcName").classList.remove("empty");
      } else {
        dstHandle = handle;
        $("dstName").textContent = handle.name;
        $("dstName").classList.remove("empty");
      }
      updateControls();
    } catch (e) {
      // 用户取消选择，忽略
      if (e && e.name !== "AbortError") log("选择文件夹出错：" + (e.message || e), "err");
    }
  }

  function updateControls() {
    const both = srcHandle && dstHandle;
    $("scanBtn").disabled = !both;
    if (!both) {
      $("previewCard").classList.remove("show");
      $("confirmBox").checked = false;
      $("syncBtn").disabled = true;
    }
  }

  function log(msg, type) {
    const box = $("logBox");
    box.classList.add("show");
    const line = document.createElement("div");
    line.className = "line" + (type ? " " + type : "");
    line.textContent = msg;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  let diffCache = null;
  let stopped = false;

  async function scan() {
    if (!srcHandle || !dstHandle) return;
    log("开始扫描源文件夹…");
    const sourcePaths = new Set();
    const sourceDirPrefixes = new Set();
    const sourceMap = new Map(); // rel -> handle
    for await (const f of walkFiles(srcHandle, "")) {
      sourcePaths.add(f.rel);
      sourceMap.set(f.rel, f.handle);
      const parts = f.rel.split("/");
      for (let i = 1; i < parts.length; i++) {
        sourceDirPrefixes.add(parts.slice(0, i).join("/"));
      }
    }
    log("源文件夹共 " + sourcePaths.size + " 个文件。");

    log("开始扫描目标文件夹…");
    const targetEntries = await listAll(dstHandle, "", []);
    log("目标文件夹共 " + targetEntries.length + " 个条目。");

    // 待删除：目标中多余的文件 / 目录
    const toDelete = [];
    for (const e of targetEntries) {
      if (e.kind === "file") {
        if (!sourcePaths.has(e.rel)) toDelete.push(e);
      } else { // directory
        if (!sourceDirPrefixes.has(e.rel)) toDelete.push(e);
      }
    }

    // 待新增/覆盖：源中所有文件一律写入目标（保证目标与源严格一致）
    // existingSameSize 仅作提示统计：目标已存在且大小相同的文件仍会被覆盖，确保内容一致
    const toAdd = [];
    const existingSameSize = [];
    for (const rel of sourcePaths) {
      toAdd.push(rel);
      try {
        const d = await getOrCreateDir(dstHandle, dirname(rel));
        const fh = await d.getFileHandle(basename(rel), { create: false });
        const tf = await fh.getFile();
        const sf = await sourceMap.get(rel).getFile();
        if (tf.size === sf.size) existingSameSize.push(rel);
      } catch (err) {
        // 目标中不存在 -> 新增
      }
    }

    diffCache = { toDelete, toAdd, sourceMap };

    // 渲染预览
    $("statDel").textContent = toDelete.length;
    $("statAdd").textContent = toAdd.length;
    $("statSame").textContent = existingSameSize.length;
    $("delCount").textContent = toDelete.length;
    $("addCount").textContent = toAdd.length;

    renderList($("delList"), toDelete.map(e => (e.kind === "directory" ? "[目录] " : "") + e.rel));
    renderList($("addList"), toAdd);

    $("previewCard").classList.add("show");
    $("confirmBox").checked = false;
    $("syncBtn").disabled = true;
    log("扫描完成：删除 " + toDelete.length + " 项，新增/覆盖 " + toAdd.length + " 项，其中目标已存在 " + existingSameSize.length + " 项（将覆盖）。", "ok");
  }

  function renderList(el, items) {
    el.innerHTML = "";
    const MAX = 400;
    const slice = items.slice(0, MAX);
    for (const it of slice) {
      const div = document.createElement("div");
      div.textContent = it;
      el.appendChild(div);
    }
    if (items.length > MAX) {
      const m = document.createElement("div");
      m.className = "more";
      m.textContent = "…还有 " + (items.length - MAX) + " 项未显示";
      el.appendChild(m);
    }
    if (items.length === 0) {
      const m = document.createElement("div");
      m.className = "more";
      m.textContent = "（无）";
      el.appendChild(m);
    }
  }

  $("confirmBox").addEventListener("change", (e) => {
    $("syncBtn").disabled = !e.target.checked;
  });

  async function sync() {
    if (!diffCache) return;
    const { toDelete, toAdd, sourceMap } = diffCache;
    const total = toDelete.length + toAdd.length;
    if (total === 0) {
      log("两个文件夹已经完全一致，无需同步。", "ok");
      return;
    }

    stopped = false;
    $("syncBtn").disabled = true;
    $("confirmBox").disabled = true;
    $("stopBtn").style.display = "inline-block";
    $("progressWrap").classList.add("show");

    let done = 0;
    const setProgress = () => {
      const pct = total ? Math.round((done / total) * 100) : 100;
      $("barFill").style.width = pct + "%";
      $("progressText").textContent = "已完成 " + done + " / " + total + " （" + pct + "%）";
    };
    setProgress();

    // 1) 先删除目标中多余的文件
    let delErr = 0;
    for (const e of toDelete) {
      if (stopped) break;
      try {
        if (e.kind === "directory") {
          await e.parent.removeEntry(e.name, { recursive: true });
        } else {
          await e.parent.removeEntry(e.name);
        }
      } catch (err) {
        delErr++;
        log("删除失败：" + e.rel + " — " + (err.message || err), "err");
      }
      done++; setProgress();
    }
    if (!stopped) {
      if (delErr === 0) log("目标多余文件清理完成。", "ok");
      else log("目标清理完成，但有 " + delErr + " 项删除失败。", "err");
    }

    // 2) 复制/覆盖源文件到目标
    let copyErr = 0;
    for (const rel of toAdd) {
      if (stopped) break;
      try {
        const srcFile = await sourceMap.get(rel).getFile();
        const dir = await getOrCreateDir(dstHandle, dirname(rel));
        const out = await dir.getFileHandle(basename(rel), { create: true });
        const w = await out.createWritable();
        await w.write(srcFile);
        await w.close();
      } catch (err) {
        copyErr++;
        log("写入失败：" + rel + " — " + (err.message || err), "err");
      }
      done++; setProgress();
    }

    if (stopped) {
      log("⏹ 同步已手动停止。目标文件夹当前为部分同步状态。", "err");
      log("如需继续，请重新点击『扫描差异』刷新状态后再同步。", "err");
      diffCache = null;
      $("previewCard").classList.remove("show");
      $("confirmBox").checked = false;
      $("syncBtn").disabled = true;
      $("stopBtn").style.display = "none";
      $("confirmBox").disabled = false;
      return;
    }

    if (copyErr === 0) log("源文件复制完成。", "ok");
    else log("复制完成，但有 " + copyErr + " 项写入失败。", "err");

    log("同步结束：" + (total - delErr - copyErr) + " / " + total + " 项成功。", delErr + copyErr === 0 ? "ok" : "err");
    $("progressText").textContent += " — 完成";
    $("confirmBox").disabled = false;
    $("stopBtn").style.display = "none";
  }

  $("pickSrc").addEventListener("click", () => pick(true));
  $("pickDst").addEventListener("click", () => pick(false));
  $("scanBtn").addEventListener("click", scan);
  $("syncBtn").addEventListener("click", sync);
  $("stopBtn").addEventListener("click", () => { stopped = true; });

  // 打赏：切换支付宝 / 微信二维码
  const qrImg = $("qrImg"), qrTip = $("qrTip");
  document.querySelectorAll(".tab").forEach((t) => {
    t.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach((x) => x.classList.remove("active"));
      t.classList.add("active");
      if (t.dataset.pay === "alipay") {
        qrImg.src = "qr/alipay.jpg";
        qrTip.textContent = "支付宝扫一扫，感谢支持！";
      } else {
        qrImg.src = "qr/wechat.jpg";
        qrTip.textContent = "微信扫一扫，感谢支持！";
      }
    });
  });
})();
</script>
</body>
</html>
